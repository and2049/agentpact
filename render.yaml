services:
  - type: web
    name: agentpact
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: agentpact-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/agentpact.db
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SELLER_SANDBOX_EMAIL
        sync: false
      - key: LLM_PROVIDER
        value: opencode
      - key: LLM_MODEL
        value: deepseek-v4.1-flash
      - key: LLM_MODEL_FAST
        value: deepseek-v4.1-flash
      - key: OPENCODE_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_SDK_LOG_WARNINGS
        value: "false"
