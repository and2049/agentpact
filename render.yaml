services:
  - type: web
    name: agentpact
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: agentpact-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/agentpact.db
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SELLER_SANDBOX_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
